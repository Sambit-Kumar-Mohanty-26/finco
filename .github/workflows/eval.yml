name: eval

# The quality gate.
#
# Separate from ci.yml deliberately. ci.yml answers "does it build and do the
# self-checks pass"; this answers "is the matcher still as good as it was", and
# those two questions fail for different reasons and want different owners. It
# is also the job to mark as a REQUIRED check: a pull request that drops
# precision below 1.000 must not be mergeable, whatever the review says.
#
# 5,000 rows on every pull request, 50,000 nightly. The large size is where an
# accidental O(n²) shows up, and it is too slow to sit in the path of every
# push; the small one is fast enough that nobody is tempted to skip it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:30 UTC — 08:00 IST, so a nightly regression is on somebody's desk when
    # they start rather than found three days later.
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # to read main's scorecard artefact for the diff
  pull-requests: write # only to post the scorecard diff as a comment

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The gate itself. Exits non-zero the moment a threshold is missed, and
      # names the metric — precision 1.000, zero false matches, recall 0.92,
      # value coverage 97%, exception F1 0.90, identity closure 100%.
      - name: Gate — 5,000 rows
        run: node --experimental-strip-types apps/api/src/eval.mts --rows 5000 --out scorecard.json

      # A second seed at the same size. The defects sit at fixed row indices and
      # the seed changes the amounts underneath them, so an engine that has
      # quietly memorised one fixture passes the first run and fails this one.
      - name: Gate — 5,000 rows, different seed
        run: node --experimental-strip-types apps/api/src/eval.mts --rows 5000 --seed 99 --out scorecard-seed99.json

      # Nightly and on main only: the size that finds the quadratic.
      - name: Gate — 50,000 rows
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node --experimental-strip-types apps/api/src/eval.mts --rows 50000 --out scorecard-50k.json

      # The run STORES its output as an artefact rather than only printing it.
      # A number in a log that expires in 90 days is not a measurement anybody
      # can go back to.
      - name: Keep the scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.run_id }}
          path: scorecard*.json
          retention-days: 90

      # --- the diff -----------------------------------------------------------
      # A pull request that passes the gate can still be a pull request that
      # made every metric slightly worse. The comment puts this branch's numbers
      # beside main's so a slide is visible in review rather than in a quarter's
      # worth of hindsight.
      # main's numbers come from the artefact its own push run already stored,
      # not from a second checkout. Rebuilding main here would mean a second
      # pnpm install for a number that has been sitting in the artefact store
      # since it merged — and if there is no such artefact yet, the diff simply
      # renders as first-run rather than failing the job.
      - name: Fetch main's scorecard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow eval.yml --branch "$GITHUB_BASE_REF" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name "scorecard-$run_id" --dir base || true
          fi
          [ -f base/scorecard.json ] && cp base/scorecard.json base.json || echo '{}' > base.json

      - name: Comment the scorecard diff
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const head = read("scorecard.json");
            const base = read("base.json") ?? {};
            if (!head) return;

            // Higher is better for every metric here except falseMatches, where
            // the only acceptable value is zero.
            const METRICS = [
              ["autoMatchPct", "auto-match %", 2],
              ["precision", "precision", 3],
              ["recall", "recall", 3],
              ["falseMatches", "false matches", 0],
              ["valueCoveragePct", "value coverage %", 2],
              ["exceptionF1", "exception F1", 3],
              ["identityClosurePct", "identity closure %", 2],
            ];
            const fmt = (v, dp) => (v === null || v === undefined ? "—" : Number(v).toFixed(dp));

            const rows = METRICS.map(([key, label, dp]) => {
              const a = base[key], b = head[key];
              const delta =
                a === undefined || a === null || b === null || b === undefined
                  ? "—"
                  : b === a
                    ? "="
                    : `${b > a ? "+" : "−"}${Math.abs(b - a).toFixed(dp)}`;
              const worse = key === "falseMatches" ? b > (a ?? 0) : b < a;
              return `| ${label} | ${fmt(a, dp)} | ${fmt(b, dp)} | ${worse ? "⚠️ " : ""}${delta} |`;
            });

            const body = [
              `### Scorecard — ${head.rows.toLocaleString("en-IN")} rows, seed ${head.seed}`,
              "",
              head.passed ? "**Gate passes.**" : `**Gate fails:** ${head.failures.map((f) => f.metric).join(", ")}`,
              "",
              "| metric | main | this PR | Δ |",
              "| --- | ---: | ---: | ---: |",
              ...rows,
              "",
              `Run hash \`${head.runHash}\` · ${head.ms}ms · unproven ${head.unprovenPaise} paise.`,
              "",
              "_Precision has no slack: a posting the truth file does not contain is a lie in the general ledger, so any false match fails the gate outright._",
            ].join("\n");

            // Edit the existing comment rather than adding one per push, so a
            // long-lived branch does not bury its own review under scorecards.
            const marker = "### Scorecard —";
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
