# Render blueprint — the free tier, which is one web service and nothing else.
#
# Free instance types cover web services only: background workers and cron jobs
# both need a paid plan. So the queue consumer runs inside the API process
# (INLINE_WORKER) rather than not running at all, and the nightly Razorpay pull
# has no home here — until this is on starter, run `pnpm cron:recon-pull` from a
# GitHub Actions schedule, or accept that the webhook is the only ingest.
#
# ponytail: one free dyno, 512 MB and 0.1 CPU shared between HTTP and closes,
# spun down after 15 minutes idle. The upgrade path is plan: starter here, a
# second `type: worker` service running `start:worker` with INLINE_WORKER unset,
# and a `type: cron` on "30 0 * * *" (06:00 IST) running `cron:recon-pull` with
# CRON_TENANT_ID set to the tenant those Razorpay keys belong to — the pull
# refuses to start without it rather than file a merchant's month under "demo".
#
# NODE_ENV=production makes pnpm skip devDependencies, so installs pass
# --prod=false: the build-time typecheck needs typescript and @types, which
# are dev deps. tsx is a real runtime dependency here (start runs TypeScript
# directly) and lives in "dependencies" for that reason.
services:
  - type: web
    name: finco-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @finco/api typecheck
    startCommand: pnpm --filter @finco/api start
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: NODE_ENV, value: production }
      # No worker service on this plan, so this process consumes the queue too.
      - { key: INLINE_WORKER, value: "true" }
      # Optional, all of them. Absent means the feature is off, not broken:
      # no webhook secret answers 503, no DSN never initialises Sentry, no
      # Gemini key closes on the five deterministic tiers.
      - { key: GEMINI_API_KEY, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: ALERT_WEBHOOK_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }
      # Google sign-in. PUBLIC_API_URL must match the redirect URI registered
      # in the Google console exactly — this service's own public URL.
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: PUBLIC_API_URL, sync: false }
