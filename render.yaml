# Render blueprint — three Node entrypoints from one build, plus the cron.
#
# Deliberately NOT the free tier for api/worker: a spun-down service breaks SSE
# and cold-starts every demo, and a spun-down worker silently stops consuming
# jobs, so runs simply never start.
# NODE_ENV=production makes pnpm skip devDependencies, so installs pass
# --prod=false: the build-time typecheck needs typescript and @types, which
# are dev deps. tsx is a real runtime dependency here (start runs TypeScript
# directly) and lives in "dependencies" for that reason.
services:
  - type: web
    name: finco-api
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @finco/api typecheck
    startCommand: pnpm --filter @finco/api start
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: NODE_ENV, value: production }
      # Optional, all of them. Absent means the feature is off, not broken:
      # no webhook secret answers 503, no DSN never initialises Sentry.
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: ALERT_WEBHOOK_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }

  - type: worker
    name: finco-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @finco/api start:worker
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: NODE_ENV, value: production }
      # The worker is where T5 and every alert actually fire, so it needs the
      # Gemini key the API does not.
      - { key: GEMINI_API_KEY, sync: false }
      - { key: ALERT_WEBHOOK_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }

  - type: cron
    name: finco-recon-pull
    runtime: node
    region: singapore
    schedule: "30 0 * * *" # 06:00 IST
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @finco/api cron:recon-pull
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: NODE_ENV, value: production }
      # Without these the pull logs that it is unconfigured and exits 0. A
      # nightly red cross everyone learns to ignore is worse than no alert.
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: ALERT_WEBHOOK_URL, sync: false }
      - { key: SENTRY_DSN, sync: false }
